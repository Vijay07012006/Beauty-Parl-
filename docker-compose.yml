version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: beauty-postgres
    environment:
      POSTGRES_USER: beauty
      POSTGRES_PASSWORD: beauty123
      POSTGRES_DB: beauty
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: beauty-redis
    command: ["redis-server", "--requirepass", "beauty-local-redis"]
    ports:
      - "127.0.0.1:6379:6379"

  prometheus:
    image: prom/prometheus:latest
    container_name: beauty_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    container_name: beauty_grafana
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
