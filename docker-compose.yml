version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: beauty-postgres
    environment:
      POSTGRES_USER: beauty
      POSTGRES_PASSWORD: beauty123
      POSTGRES_DB: beauty
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: beauty-redis
    command: ["redis-server", "--requirepass", "beauty-local-redis"]
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data:
